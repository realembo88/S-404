name: PUBG Sync

on:
  schedule:
    # Stuendlich zur Minute 17. Bewusst NICHT zur vollen Stunde:
    # ':00' ist der meistgenutzte Zeitpunkt und wird von GitHub am staerksten
    # gedrosselt. Der Lauf dauert rund eine Minute, blockiert also nichts.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pubg-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhaengigkeiten installieren
        run: pip install --quiet requests

      - name: Matches, Waffen und Clan abholen
        env:
          PUBG_API_KEY: ${{ secrets.PUBG_API_KEY }}
        run: python pubg_clan_sync.py

      - name: Aenderungen committen
        run: |
          if [ -z "$(git status --porcelain pubg_matches.csv weapons.csv clan.json)" ]; then
            echo "Nichts Neues - kein Commit noetig."
            exit 0
          fi
          git config user.name  "PUBG Sync Bot"
          git config user.email "actions@github.com"
          git add pubg_matches.csv weapons.csv clan.json
          git commit -m "Sync: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
