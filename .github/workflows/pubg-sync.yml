name: PUBG Sync

on:
  schedule:
    # Stuendlich starten. Der Lauf selbst synchronisiert dann viermal
    # im Abstand von 15 Minuten - das ist verlaesslicher als */15,
    # weil GitHub geplante Laeufe unter Last verzoegert oder ausfallen laesst.
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pubg-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhaengigkeiten installieren
        run: pip install --quiet requests

      - name: Viermal synchronisieren, alle 15 Minuten
        env:
          PUBG_API_KEY: ${{ secrets.PUBG_API_KEY }}
        run: |
          git config user.name  "PUBG Sync Bot"
          git config user.email "actions@github.com"

          for i in 1 2 3 4; do
            echo "::group::Lauf $i von 4"

            if python pubg_clan_sync.py; then
              if [ -n "$(git status --porcelain pubg_matches.csv)" ]; then
                git add pubg_matches.csv
                git commit -m "Sync: $(date -u '+%Y-%m-%d %H:%M') UTC"
                # Falls parallel ein anderer Lauf gepusht hat: erst nachziehen
                git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
                git push || echo "Push fehlgeschlagen - naechster Lauf versucht es erneut."
              else
                echo "Keine neuen Matches."
              fi
            else
              echo "Abholung fehlgeschlagen - naechster Lauf versucht es erneut."
            fi

            echo "::endgroup::"

            if [ "$i" -lt 4 ]; then
              echo "Warte 15 Minuten ..."
              sleep 900
            fi
          done
