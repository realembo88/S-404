name: PUBG Sync

on:
  schedule:
    - cron: '*/15 15-23 * * *'   # alle 15 Min., 17–02 Uhr deutscher Zeit
    - cron: '0 2,6,11,13 * * *'     # Nachzügler tagsüber
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pubg-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhaengigkeiten installieren
        run: pip install --quiet requests

      - name: Matches abholen
        env:
          PUBG_API_KEY: ${{ secrets.PUBG_API_KEY }}
        run: python pubg_clan_sync.py

      - name: Aenderungen committen
        run: |
          if [ -z "$(git status --porcelain pubg_matches.csv)" ]; then
            echo "Keine neuen Matches - nichts zu committen."
            exit 0
          fi
          git config user.name  "PUBG Sync Bot"
          git config user.email "actions@github.com"
          git add pubg_matches.csv
          git commit -m "Sync: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
